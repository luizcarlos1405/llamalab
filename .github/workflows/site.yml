name: Site

# The admin reads this workflow's runs by this file's name, to tell editors when what they
# published didn't go live (deployRun in src/admin/github.js): rename both together.

on:
  push:
    branches: [main]
  # Rebuild every day just after midnight in Dourados (UTC-4), so events that
  # already happened leave the home page and the agenda.
  schedule:
    - cron: '7 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build
        # Fails when the content points to an image that isn't in the bucket nor in the
        # repository (the build checks GITHUB_ACTIONS), so the deploy doesn't run and the site
        # keeps its last good version. See "When a deploy fails" in README.md.
        run: node scripts/build.mjs
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
